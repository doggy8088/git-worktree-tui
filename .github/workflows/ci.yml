name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 測試 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: 準備 zsh
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y zsh
          fi
          zsh --version
          git --version
          python3 --version

      - name: 語法檢查
        run: make lint

      - name: 執行測試
        run: make test

  # PowerShell 7 版（gwt.psm1）。在 Windows 上跑：包含語法檢查、單元測試、
  # 用測試掛鉤餵按鍵的測試，以及在 ConPTY 真主控台裡送真按鍵的測試。
  test-pwsh:
    name: 測試 PowerShell (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: 版本資訊
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion.ToString()
          git --version

      - name: 執行測試
        shell: pwsh
        run: ./tests/pwsh/run.ps1
