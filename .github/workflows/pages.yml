name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: 部署網站
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: 把安裝腳本放進網站（one-line install 用）
        run: |
          cp install.sh site/install.sh
          cp install.ps1 site/install.ps1

      - name: 設定 Pages
        uses: actions/configure-pages@v5

      - name: 上傳 site/ 目錄
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 部署
        id: deploy
        uses: actions/deploy-pages@v4
